<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Details</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            position: relative; /* Container for absolute elements */
            overflow: hidden; /* Keeps image inside the corners */
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* The background image */
        .card img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Fills the area */
            z-index: 0;
        }

        /* The transparent black overlay content */
        .content {
            position: relative;
            z-index: 1;
            padding: 40px;
            background: rgba(0, 0, 0, 0.6); /* Semi-transparent black */
            backdrop-filter: blur(4px); /* Optional: slight blur for readability */
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 0;
            color: #4ecca3;
        }

        p {
            line-height: 1.6;
            color: #eeeeee;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            width: 100%; /* Changed from 30vw for better responsiveness */
            margin: 30px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0,0,0,0.3);
            padding-top: 20px;
            padding-bottom: 20px;
            border-radius: 15px;
        }

        .stat-item b {
            display: block;
            font-size: 1.2em;
            color: #4ecca3;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #1a1a2e;
            background: #4ecca3;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }

        .back-btn:hover {
            transform: scale(1.05);
            background: #45b291;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="cenario-img.jpg" alt="Background">
        
        <div class="content">
            <h1>Model Specifications</h1>
            <p>This 3D element is a high-fidelity GLTF model optimized for mobile augmented reality experiences.</p>
            
            <div class="stats">
                <div class="stat-item">
                    <b>Format</b>
                    <span>GLB/GLTF</span>
                </div>
                <div class="stat-item">
                    <b>Scale</b>
                    <span>0.05x</span>
                </div>
                <div class="stat-item">
                    <b>Type</b>
                    <span>Animated</span>
                </div>
            </div>

            <a href="index.html" class="back-btn">Return to AR</a>
        </div>
    </div>

</body>
</html>
