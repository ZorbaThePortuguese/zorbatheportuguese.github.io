<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #772c36 0%, #fee5b8 50%, #bc6a43 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 90%;
            max-width: 400px;
        }

        .logo-container {
            margin-bottom: 2rem;
        }

        .app-logo {
            width: 120px;
            height: 120px;
            border-radius: 22%; /* App icon style */
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Placeholder logo if no image is found */
        .logo-placeholder {
            width: 100px;
            height: 100px;
            background: white;
            color: #764ba2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 2rem;
            border-radius: 22%;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .cta-button {
            display: inline-block;
            background: #ffffff;
            color: #764ba2;
            text-decoration: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            background: #f8f9fa;
        }

        .cta-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="logo.png" alt="App Logo" class="app-logo" onerror="this.style.display='none'; document.getElementById('fallback').style.display='flex'">
            
            <div id="fallback" class="logo-placeholder" style="display: none;">A</div>
        </div>

        <h1>Welcome to TH3 - Enjoy theatre in all dimensions</h1>

        <a href="./TH3app.html" class="cta-button">START NOW</a>
    </div>

</body>
</html>
