<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <title>App Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Limelight", sans-serif;
            /* Your original gradient */
            background: linear-gradient(135deg, #35090f 0%, #681f16 50%, #a77b1c 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 3.5rem 2rem;
            border-radius: 30px;
            width: 90vw;
            max-width: 450px;
            /* Added a dark glass effect for maximum contrast */
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .logo-container {
            margin-bottom: 2rem;
        }

        .app-logo {
            width: 20vw; /* Changed to fixed size for better control */
            border-radius: 22%;
            filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.2));
        }

        .logo-placeholder {
            width: 100%;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 2.5rem;
            border-radius: 22%;
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: 2rem;
            letter-spacing: 2px;
            /* Cleaned up text shadow for better legibility */
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            text-transform: uppercase;
            color: #f8e4b7; /* Slight gold tint for the header */
        }

        p {
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
            font-family: "Montserrat", sans-serif; /* Cleaner font for the subtitle */
            letter-spacing: 1px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
            color: #eeeeee;
        }

        .cta-button {
            display: inline-block;
            background: #ffffff;
            color: #35090f; /* Changed to match your background theme */
            text-decoration: none;
            padding: 1.2rem 3rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            font-family: "Montserrat", sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            background: #f8e4b7; /* Hover turns a soft gold */
        }

        .cta-button:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="th3logo.png" alt="App Logo" class="app-logo" onerror="this.style.display='none'; document.getElementById('fallback').style.display='flex'">
            <div id="fallback" class="logo-placeholder" style="display: none;">T3</div>
        </div>

        <h1>Welcome to TH3</h1>
        <p>Enjoy theatre in all dimensions</p>

        <a href="./TH3app.html" class="cta-button">START NOW</a>
    </div>

</body>
</html>
